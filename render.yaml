databases:
  - name: adaptive-assessment-db
    databaseName: adaptive_assessment
    user: postgres
    plan: free

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: adaptive-assessment-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adaptive-assessment-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DEV_EXPOSE_OTP_IN_RESPONSE
        value: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # 2. React + Vite Frontend Static Site
  - type: web
    name: adaptive-assessment-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://adaptive-assessment-backend.onrender.com/api
